name: Format classes branch

on:
  push:
    branches: [feat/group-training-os-20260922]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[classes-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/classes src/app.module.ts src/rbac/permissions.catalog.ts src/rbac/roles.catalog.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classes src/app.module.ts src/rbac/permissions.catalog.ts src/rbac/roles.catalog.ts prisma/migrations/20260922230000_add_group_training_os/migration.sql
          git diff --cached --quiet && exit 0
          git commit -m "chore: format group training [classes-format]"
          git push
