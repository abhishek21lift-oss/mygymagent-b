name: Deploy Backend

on:
  # Only a main commit that passed CI goes live. Deploying on `push` ran
  # in parallel with CI, so a commit that failed its tests still shipped.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual redeploy of main's current commit (Actions → Deploy Backend).
  workflow_dispatch:

concurrency:
  group: mygymagent-backend-production
  # Never stop a deploy halfway (between build and restart); a newer one
  # waits its turn instead.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script: |
            set -eu

            cd /opt/thecultclient/mygymagent-b

            echo "==> Syncing backend with GitHub main"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              # CI for an older commit finished after a newer one landed:
              # the newer commit's own deploy ships it once its CI passes.
              echo "==> $DEPLOY_SHA is no longer main's latest commit; skipping"
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"

            echo "==> Rebuilding backend at $DEPLOY_SHA"
            cd /opt/thecultclient
            docker compose build backend

            echo "==> Recreating backend"
            docker compose up -d --no-deps --force-recreate backend

            # Pending migrations run before the API listens, so a boot can
            # take well over 10 s. Wait up to 3 minutes.
            echo "==> Waiting for backend health"
            healthy=0
            for attempt in $(seq 1 36); do
              if curl -fsS --max-time 5 https://api.mygymagent.tech/health >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 5
            done

            docker ps --filter "name=thecultclient-backend"

            if [ "$healthy" != 1 ]; then
              echo "==> Backend did not become healthy; last logs:"
              docker compose logs --tail=200 backend || true
              exit 1
            fi

            curl -fsS https://api.mygymagent.tech/health
            echo ""

            # Old images pile up with a build on every deploy.
            docker image prune -f >/dev/null 2>&1 || true

            echo "==> Backend deployment successful ($DEPLOY_SHA)"
