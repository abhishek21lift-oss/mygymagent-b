name: Deploy Backend

on:
  push:
    branches:
      - main

concurrency:
  group: mygymagent-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            cd /opt/thecultclient/mygymagent-b

            echo "==> Syncing backend with GitHub main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Rebuilding backend"
            cd /opt/thecultclient
            docker compose build backend

            echo "==> Recreating backend"
            docker compose up -d --no-deps --force-recreate backend

            echo "==> Waiting for backend"
            sleep 10

            echo "==> Backend container status"
            docker ps --filter "name=thecultclient-backend"

            echo "==> Backend health check"
            curl -fsS https://api.mygymagent.tech/health

            echo ""
            echo "==> Backend deployment successful"
