name: Format remaining OS
on:
  push:
    branches: ["feat/full-remaining-os-20260922"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/business-os src/communications/providers/http-channel.provider.ts src/ai/global-ai-command.service.ts src/rbac/permissions.catalog.ts src/rbac/roles.catalog.ts src/app.module.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/business-os src/communications/providers/http-channel.provider.ts src/ai/global-ai-command.service.ts src/rbac/permissions.catalog.ts src/rbac/roles.catalog.ts src/app.module.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format remaining business OS"
          git push
