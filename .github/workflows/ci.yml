name: CI

on:
  push:
    branches: [main, 'claude/**', 'p0/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mygymagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      # No official s3rver Docker image exists, unlike Postgres/Redis above --
      # run it as a background process instead (same binary the e2e suite's
      # own README/local setup uses), so CI exercises the exact same
      # S3-protocol test double as local dev, not a different mock.
      - name: Start local S3-compatible test server (s3rver)
        run: npx s3rver -d /tmp/s3rver-data -a 0.0.0.0 -p 4568 --allow-mismatched-signatures &

      - name: E2E tests (migrates + seeds the test database, creates the test bucket)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t mygymagent-b:ci .
