name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a branch's run, but never main's: main's run
  # ends in the production deploy, which must not be stopped halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mygymagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      # Guards against a schema change landing without the migration that
      # produces it -- the failure mode that accumulated 475 lines of drift
      # before B-P0-12. Runs before the tests because a drifted schema
      # makes every later failure harder to read.
      - name: Schema/migration drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mygymagent_drift_check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE mygymagent_drift_check'
          npm run db:check-drift

      - name: Unit tests
        run: npm test

      # No official s3rver Docker image exists, unlike Postgres/Redis above --
      # run it as a background process instead (same binary the e2e suite's
      # own README/local setup uses), so CI exercises the exact same
      # S3-protocol test double as local dev, not a different mock.
      - name: Start local S3-compatible test server (s3rver)
        run: npx s3rver -d /tmp/s3rver-data -a 0.0.0.0 -p 4568 --allow-mismatched-signatures &

      - name: E2E tests (migrates + seeds the test database, creates the test bucket)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t mygymagent-b:ci .

  # Production deploy, only after `test` passes on a push to main. It lives
  # here rather than in a `workflow_run` workflow because GitHub runs those
  # only from the repository's default branch, which for this repository
  # is not main -- the separate Deploy Backend workflow never fired.
  deploy:
    name: Deploy Backend to VPS
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: mygymagent-backend-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script: |
            set -eu

            cd /opt/thecultclient/mygymagent-b

            echo "==> Syncing backend with GitHub main"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              # CI for an older commit finished after a newer one landed:
              # the newer commit's own deploy ships it once its CI passes.
              echo "==> $DEPLOY_SHA is no longer main's latest commit; skipping"
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"

            echo "==> Rebuilding backend at $DEPLOY_SHA"
            cd /opt/thecultclient
            docker compose build backend

            echo "==> Recreating backend"
            docker compose up -d --no-deps --force-recreate backend

            # Pending migrations run before the API listens, so a boot can
            # take well over 10 s. Wait up to 3 minutes.
            echo "==> Waiting for backend health"
            healthy=0
            for attempt in $(seq 1 36); do
              if curl -fsS --max-time 5 https://api.mygymagent.tech/health >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 5
            done

            docker ps --filter "name=thecultclient-backend"

            if [ "$healthy" != 1 ]; then
              echo "==> Backend did not become healthy; last logs:"
              docker compose logs --tail=200 backend || true
              exit 1
            fi

            curl -fsS https://api.mygymagent.tech/health
            echo ""

            # Old images pile up with a build on every deploy.
            docker image prune -f >/dev/null 2>&1 || true

            echo "==> Backend deployment successful ($DEPLOY_SHA)"
