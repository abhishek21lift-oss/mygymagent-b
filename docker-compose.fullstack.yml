# One-command local environment for the ENTIRE MyGymAgent platform:
# Postgres + Redis + MinIO (S3-compatible object storage) + MailHog (SMTP)
# + the API + the web app.
#
#   docker compose -f docker-compose.fullstack.yml up --build
#
# The API auto-applies migrations and seeds the RBAC catalog + the
# "Demo Fitness Club" demo organization on first boot (both seeds are
# idempotent, so restarts are safe). Open http://localhost:3000 and log in
# with owner@demogym.test / DemoPass123! (see the API boot logs for the
# full list of demo accounts). MailHog's inbox UI is at http://localhost:8025.
#
# Two notes:
# - S3_ENDPOINT is set to http://localhost:9000 (browser-reachable) and the
#   api service maps `localhost` to the Docker host via host-gateway, so the
#   API can reach MinIO through the same URL its signed URLs advertise to
#   the browser. Requires Docker 20.10+ (host-gateway support).
# - Everything here is for local development only -- never point this at
#   production data.

name: mygymagent-fullstack

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mygymagent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: S3RVER
      MINIO_ROOT_PASSWORD: S3RVER
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  # Creates the S3 bucket the API expects; the file-storage service does
  # not create buckets itself (see src/files/README.md).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 S3RVER S3RVER 2>/dev/null; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing local/mygymagent-dev
        echo "bucket ready"

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      target: build
    working_dir: /app
    # Migrate, seed the permission catalog + demo org, then start in watch
    # mode. Both seeds are idempotent (they skip if already present).
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx prisma/seed-dev.ts && npm run start:dev"
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mygymagent?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me-in-production-please
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-in-production-please
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
      # MailHog accepts everything on :1025, no auth, no TLS.
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      # Bare address -- the provider formats the display name itself
      # (see src/communications/providers/smtp-email.provider.ts).
      SMTP_FROM_ADDRESS: no-reply@mygymagent.local
      # Browser-reachable endpoint so presigned URLs work; the API itself
      # reaches MinIO through localhost:9000 on the host (extra_hosts).
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: mygymagent-dev
      S3_ACCESS_KEY_ID: S3RVER
      S3_SECRET_ACCESS_KEY: S3RVER
    extra_hosts:
      - 'localhost:host-gateway'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./test:/app/test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../mygymagent-f
      args:
        # Inlined into the client bundle at build time -- must be the
        # browser-visible API URL.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data: